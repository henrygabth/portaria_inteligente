<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Redefinir Senha - Controle de Saídas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" href="./css/style.css">
    <script src="./js/general/reset_password.js" defer></script>
</head>
<body class="centralize">
    <form id="resetForm">
        <div class="form-field">
            <label for="novaSenha">Nova senha</label>
            <input type="password" placeholder="Mínimo 6 caracteres" id="novaSenha" minlength="6" required />
        </div>
        <div class="form-field">
            <label for="confirmarSenha">Confirmar nova senha</label>
            <input type="password" placeholder="Repita a senha" id="confirmarSenha" minlength="6" required />
            <div class="error" id="senha-diferente-error" style="display:none;">As senhas não coincidem</div>
        </div>
        <div>
            <button type="submit" class="enter-btn" id="reset-button">
                Redefinir senha
            </button>
        </div>
        <div>
            <button type="button" class="clear" onclick="window.location.href='login.html'">
                Voltar ao login
            </button>
        </div>
    </form>
</body>
</html>
