<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Redefinir Senha - Controle de Saídas</title>
    <link rel="shortcut icon" href="./img/logo_pi.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0A192F">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/icones/icone-192.png">
    <link rel="apple-touch-icon" href="/img/icones/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Portaria">
    <script src="/js/general/acessibilidade.js"></script>
    <link rel="stylesheet" href="/css/acessibilidade.css?v=2">
    <link rel="stylesheet" href="/css/recursos.css?v=2">
    <script src="/js/general/pwa.js" defer></script>
    <link rel="stylesheet" type="text/css" media="screen" href="./css/style.css?v=5">
    <script src="./js/general/reset_password.js?v=2" defer></script>
    <script src="./js/general/particulas.js?v=1"></script>
</head>
<body class="centralize" data-fundo="gradiente">
    <h1 class="sr-only">Criar nova senha</h1>
    <form id="resetForm">
        <div class="form-field">
            <label for="novaSenha">Nova senha</label>
            <input type="password" placeholder="Mínimo 8 caracteres, com letras e números" id="novaSenha" minlength="8" maxlength="72" autocomplete="new-password" required />
        </div>
        <div class="form-field">
            <label for="confirmarSenha">Confirmar nova senha</label>
            <input type="password" placeholder="Repita a senha" id="confirmarSenha" minlength="8" maxlength="72" autocomplete="new-password" required />
            <div class="error" id="senha-diferente-error" style="display:none;">As senhas não coincidem</div>
        </div>
        <div>
            <button type="submit" class="enter-btn" id="reset-button">
                Redefinir senha
            </button>
        </div>
        <div>
            <button type="button" class="clear" onclick="window.location.href='login.html'">
                Voltar ao login
            </button>
        </div>
    </form>
    <script src="./js/general/ui-extras.js?v=1" defer></script>
</body>
</html>
