<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Controle de Saídas</title>
    <link rel="stylesheet" type="text/css" href="./css/style.css">
</head>
<body class="centralize">
    <form id="loginForm">
        <div class="form-field">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="E-mail" oninput="onChangeEmail()" required />
            <div class="error" id="email-required-error" style="display: none;">E-mail é obrigatório</div>
            <div class="error" id="email-invalid-error" style="display: none;">E-mail é inválido</div>
        </div>

        <div class="form-field">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Senha" oninput="onChangePassword()" required />
            <div class="error" id="password-required-error" style="display: none;">Senha é obrigatória</div>
            <div class="error" id="password-min-length-error" style="display: none;">A senha deve ter pelo menos 6 caracteres</div>
        </div>

        <div>
            <button type="submit" class="enter-btn" id="login-button" disabled>Entrar</button>
        </div>
        <div>
            <button type="button" class="clear" id="recover-password-button" onclick="recoverPassword()">
                Recuperar senha
            </button>
        </div>
    </form>
    <script src="./js/general/index.js"></script>
</body>
</html>
