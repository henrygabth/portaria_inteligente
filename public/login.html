<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0A192F">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/icones/icone-192.png">
    <link rel="apple-touch-icon" href="/img/icones/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Portaria">
    <script src="/js/general/acessibilidade.js"></script>
    <script src="/js/general/dialogo.js"></script>
    <link rel="stylesheet" href="/css/acessibilidade.css?v=3">
    <link rel="stylesheet" href="/css/recursos.css?v=2">
    <script src="/js/general/pwa.js?v=2" defer></script>
    <title>Login - Controle de Saídas</title>
    <link rel="shortcut icon" href="./img/logo_pi.png" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="./css/style.css?v=5">
    <script src="./js/general/particulas.js?v=1"></script>
</head>
<body class="centralize" data-fundo="gradiente" data-a11y-boas-vindas>
    <h1 class="sr-only">Entrar no Portaria Inteligente</h1>
    <form id="loginForm">
        <div class="form-field">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="E-mail" oninput="onChangeEmail()" required />
            <div class="error" id="email-required-error" style="display: none;">E-mail é obrigatório</div>
            <div class="error" id="email-invalid-error" style="display: none;">E-mail é inválido</div>
        </div>

        <div class="form-field">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Senha" oninput="onChangePassword()" required />
            <div class="error" id="password-required-error" style="display: none;">Senha é obrigatória</div>
            <div class="error" id="password-min-length-error" style="display: none;">A senha deve ter pelo menos 6 caracteres</div>
        </div>

        <div>
            <button type="submit" class="enter-btn" id="login-button" disabled>Entrar</button>
        </div>
        <div>
            <button type="button" class="clear" id="recover-password-button" onclick="recoverPassword()">
                Recuperar senha
            </button>
        </div>
        <p class="link-privacidade"><a href="politica-privacidade.html">Privacidade e proteção de dados</a></p>
    </form>
    <script src="./js/general/index.js?v=3"></script>
    <script src="./js/general/ui-extras.js?v=1" defer></script>
</body>
</html>
