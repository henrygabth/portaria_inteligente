<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha - Controle de Saídas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" href="./css/style.css">
    <script src="./js/general/index.js" defer></script>
</head>
<body class="centralize">
    <form id="recoverForm" onsubmit="recoverPassword(event)">
        <div class="form-field">
            <label for="email">Email</label>
            <input type="email" placeholder="seu@email.com" id="email" oninput="onChangeEmail()" required />
            <div class="error" id="email-required-error">Email é obrigatório</div>
            <div class="error" id="email-invalid-error">Email é inválido</div>
        </div>
        <div>
            <button type="submit" class="enter-btn" disabled id="recover-button">
                Enviar solicitação
            </button>
        </div>
        <div>
            <button type="button" class="clear" onclick="window.location.href='login.html'">
                Voltar ao login
            </button>
        </div>
    </form>
</body>
</html>
