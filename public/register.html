<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registro - Controle de Saídas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" href="./css/style.css">
    <script src="./js/general/index.js" defer></script>
</head>
<body class="centralize">
    <form id="registerForm" onsubmit="register(event)">
        <div class="form-field">
            <label for="email">Email</label>
            <input type="email" placeholder="E-mail" id="email" oninput="onChangeEmail()" required />
            <div class="error" id="email-required-error">Email é obrigatório</div>
            <div class="error" id="email-invalid-error">Email é inválido</div>
        </div>

        <div class="form-field">
            <label for="password">Senha</label>
            <input type="password" placeholder="Senha" id="password" oninput="onChangePassword()" required />
            <div class="error" id="password-required-error">Senha é obrigatória</div>
            <div class="error" id="password-min-length-error">Senha deve ter no mínimo 6 caracteres</div>
        </div>

        <div class="form-field">
            <label for="confirmPassword">Confirmar senha</label>
            <input type="password" placeholder="Confirmar senha" id="confirmPassword" oninput="onChangeConfirmPassword()" required />
            <div class="error" id="password-doesnt-match-error">Senha e confirmação devem ser iguais</div>
        </div>

        <div class="form-field">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Nome Completo" oninput="updateButtonState()" required />
            <div class="error" id="nome-required-error">Nome é obrigatório</div>
        </div>

        <div class="form-field">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="CPF" oninput="updateButtonState()" required />
            <div class="error" id="cpf-required-error">CPF é obrigatório</div>
        </div>

        <div class="form-field">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" placeholder="Telefone" oninput="updateButtonState()" required />
            <div class="error" id="telefone-required-error">Telefone é obrigatório</div>
        </div>

        <div class="form-field">
            <label for="tipo_usuario">Tipo de Usuário</label>
            <select id="tipo_usuario" onchange="updateButtonState()" required>
                <option value="">Selecione...</option>
                <option value="PAI">Pai</option>
                <option value="SECRETARIA">Secretaria</option>
                <option value="PORTEIRO">Porteiro</option>
                <option value="ADMIN">Admin</option>
            </select>
        </div>

        <div>
            <button type="submit" class="enter-btn" disabled id="register-button">Registrar</button>
        </div>
        <div>
            <button type="button" class="clear" onclick="window.location.href='login.html'">Login</button>
        </div>
    </form>
</body>
</html>
